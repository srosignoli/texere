name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test & Lint (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install system WebKit dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config build-essential

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Node.js dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (Linux amd64)
        run: wails build -platform linux/amd64 -tags webkit2_41

      - name: Test
        run: go test ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint
        run: golangci-lint run ./...

  build-windows:
    name: Cross-Compile (Windows amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install mingw-w64 cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Node.js dependencies
        working-directory: frontend
        run: npm ci

      - name: Cross-compile (Windows amd64)
        run: CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 wails build -platform windows/amd64
