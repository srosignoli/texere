<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <!-- Experiment for the YouTube embed's "Error 153" (player configuration
         error). The theory is that YouTube rejects the embed because it cannot
         verify a referrer from this window's wails:// origin. Caveat: this
         policy only controls how MUCH referrer is sent, not what it is, so it
         cannot present an https origin we do not have. Harmless either way —
         it is the standard default in browsers. -->
    <meta name="referrer" content="strict-origin-when-cross-origin"/>
    <title>texere</title>
</head>
<body>
<div id="app"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  document.getElementById('app').innerHTML =
    '<pre style="color:#f87171;background:#1b2636;padding:20px;white-space:pre-wrap">' +
    'JS ERROR: ' + msg + '\n' + (err && err.stack ? err.stack : '') + '</pre>';
};
window.addEventListener('unhandledrejection', function(e) {
  document.getElementById('app').innerHTML =
    '<pre style="color:#f87171;background:#1b2636;padding:20px;white-space:pre-wrap">' +
    'UNHANDLED REJECTION: ' + e.reason + '</pre>';
});
</script>
<script>
  // Runs before first paint so a stored theme cannot flash blue: style.css
  // paints html's background immediately, and a Wails binding cannot be read
  // synchronously. config.json remains authoritative — the app reconciles this
  // mirror from Go on startup.
  //
  // Blue needs no attribute — it is :root's own values — so this acts only for
  // the two themes that differ, and a localStorage failure leaves the default.
  try {
    var t = localStorage.getItem('texere.theme')
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
  } catch (e) {}
</script>
<script src="./src/main.js" type="module"></script>
</body>
</html>
