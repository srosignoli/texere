<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>texere</title>
</head>
<body>
<div id="app"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  document.getElementById('app').innerHTML =
    '<pre style="color:#f87171;background:#1b2636;padding:20px;white-space:pre-wrap">' +
    'JS ERROR: ' + msg + '\n' + (err && err.stack ? err.stack : '') + '</pre>';
};
window.addEventListener('unhandledrejection', function(e) {
  document.getElementById('app').innerHTML =
    '<pre style="color:#f87171;background:#1b2636;padding:20px;white-space:pre-wrap">' +
    'UNHANDLED REJECTION: ' + e.reason + '</pre>';
});
</script>
<script src="./src/main.js" type="module"></script>
</body>
</html>
